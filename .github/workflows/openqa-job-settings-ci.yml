name: openqa-job-settings CI

on: [push, pull_request]

jobs:
  perl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openSUSE/openQA/Helpers/openqa-job-settings

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Perl runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            perl \
            make \
            libmojolicious-perl

      - name: Run the project test suite
        run: |
          perl -v
          prove -Ilib -I t/lib
